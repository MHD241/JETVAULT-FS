<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JetVault Cockpit Studio</title>
<style>
  :root { --bg:#14171c; --panel:#1b1f26; --line:#2a3039; --txt:#d6dbe1; --dim:#8b94a0; --acc:#4f8ef7; }
  * { box-sizing: border-box; } html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:13px system-ui,sans-serif; overflow:hidden; }
  #app { display:grid; grid-template-columns:150px 1fr 280px; grid-template-rows:42px 1fr; height:100%; }
  #top { grid-column:1/4; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:6px; align-items:center; padding:0 10px; overflow-x:auto; white-space:nowrap; }
  #left { background:var(--panel); border-right:1px solid var(--line); padding:8px; overflow-y:auto; }
  #right { background:var(--panel); border-left:1px solid var(--line); padding:10px; overflow-y:auto; }
  #view { position:relative; } canvas { display:block; width:100%; height:100%; }
  button { background:#262c35; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:5px 9px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--acc); } button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  #left button { display:block; width:100%; margin-bottom:6px; text-align:left; }
  h4 { margin:10px 0 6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .row { display:grid; grid-template-columns:92px 1fr 52px; gap:6px; align-items:center; margin-bottom:5px; }
  .row label { color:var(--dim); } input[type=range] { width:100%; } input[type=number], input[type=text], select { width:100%; background:#10131a; color:var(--txt); border:1px solid var(--line); border-radius:5px; padding:3px 5px; }
  input[type=color] { width:100%; height:24px; padding:0; border:1px solid var(--line); background:none; }
  #list { max-height:34vh; overflow-y:auto; border:1px solid var(--line); border-radius:6px; margin-bottom:8px; }
  #list div { padding:4px 8px; cursor:pointer; border-bottom:1px solid var(--line); } #list div.sel { background:#27406b; }
  #msg { position:absolute; left:10px; bottom:8px; color:var(--dim); font-size:12px; pointer-events:none; }
  #lock { position:fixed; inset:0; background:#0c0e12; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; z-index:10; }
  #lock input { width:240px; text-align:center; font-size:16px; padding:8px; }
  .sep { width:1px; height:22px; background:var(--line); margin:0 4px; }
</style>
</head>
<body>
<div id="lock"><div style="font-size:18px">JetVault Cockpit Studio</div><div id="lockmsg" style="color:#8b94a0"></div><input id="pass" type="password" placeholder="passcode" autofocus><button id="unlock">Enter</button></div>
<div id="app">
  <div id="top"></div>
  <div id="left"></div>
  <div id="view"><div id="msg"></div></div>
  <div id="right"></div>
</div>
<script type="module" src="/src/studio/studio.ts"></script>
</body>
</html>
